[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bom-comic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "Pillow>=10.1,<13", "python-dotenv>=1,<2", "google-genai>=1,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
bom-comic = "bom_comic.cli:main"
[tool.setuptools.packages.find]
include = ["bom_comic*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

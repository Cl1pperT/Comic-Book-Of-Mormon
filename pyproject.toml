[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bom-comic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "Pillow>=10.1,<13", "python-dotenv>=1,<2", "google-genai>=1,<3",
                "numpy>=1.26", "opencv-python-headless>=4.8"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
# The volunteer review website (review_site/); see review_site/README.md
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.2", "alembic>=1.13,<2", "argon2-cffi>=23",
       "jinja2>=3.1,<4", "python-multipart>=0.0.9", "itsdangerous>=2.2", "httpx>=0.27"]
[project.scripts]
bom-comic = "bom_comic.cli:main"
[tool.setuptools.packages.find]
include = ["bom_comic*"]
[tool.setuptools.package-data]
bom_comic = ["fonts/*", "detectors/*", "reader.html"]
[tool.pytest.ini_options]
testpaths = ["tests", "review_site/tests"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Reader</title>
<style>
  :root {
    --bg: #e9e5dc; --surface: #fbfaf7; --ink: #1f1c18; --muted: #6f675b; --line: #d6cfc2;
    --accent: #2f5d8a; --accent-ink: #ffffff; --flag: #c0392b; --flag-soft: rgba(192, 57, 43, 0.14);
    --hover: rgba(47, 93, 138, 0.18); --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --surface: #262421; --ink: #ece7de; --muted: #a39b8e; --line: #3a3733;
      --accent: #7fb0e0; --accent-ink: #10202f; --flag: #ff6b5b; --flag-soft: rgba(255, 107, 91, 0.16);
      --hover: rgba(127, 176, 224, 0.2); --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 100vh; }
  main { padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .page { position: relative; width: 100%; max-width: 860px; box-shadow: var(--shadow); background: #efe9dc; }
  .page img { display: block; width: 100%; height: auto; }
  .page-label { position: absolute; top: -20px; left: 0; font-size: 12px; color: var(--muted); }
  .panel { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer;
           outline: 3px solid transparent; outline-offset: -3px; transition: outline-color .1s, background .1s; }
  .panel:hover { background: var(--hover); outline-color: var(--accent); }
  .panel:focus-visible { outline-color: var(--accent); }
  .panel.flagged { outline-color: var(--flag); }
  .panel.flagged:hover { background: var(--flag-soft); }
  .panel.selected { outline: 4px solid var(--accent); outline-offset: -4px; background: var(--hover); }
  .badge { position: absolute; top: 8px; right: 8px; background: var(--flag); color: #fff; font: 600 12px/1 system-ui;
           padding: 5px 7px; border-radius: 999px; box-shadow: var(--shadow); pointer-events: none; }
  .badge.redrawn { background: var(--accent); color: var(--accent-ink); }
  .panel.redrawn { outline-color: var(--accent); outline-style: dashed; }
  .chapter-end { display: flex; gap: 10px; }
  aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
          border-left: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 17px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .nav { display: flex; gap: 6px; margin-top: 10px; }
  .nav select { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
                border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .nav select:focus { outline: 2px solid var(--accent); }
  button.step { font: inherit; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  button.step:hover:not(:disabled) { border-color: var(--accent); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg); }
  .hint { color: var(--muted); margin: 0; }
  .meta { font-weight: 600; }
  .meta span { font-weight: 400; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
          padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
             padding: 8px 10px; font: inherit; background: var(--surface); color: var(--ink); }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button.primary, button.secondary { font: inherit; font-weight: 600; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
  button.secondary { background: transparent; color: var(--flag); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; color: var(--muted); }
  .keys { font-size: 12px; color: var(--muted); margin-top: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  h3 { font-size: 13px; margin: 12px 0 6px; }
  h3:first-child { margin-top: 0; }
  .flags { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .flags button { width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--bg);
                  border: 1px solid var(--line); border-left: 4px solid var(--flag); border-radius: 8px;
                  padding: 8px 10px; cursor: pointer; }
  .flags button:hover { border-color: var(--accent); border-left-color: var(--flag); }
  .flags .note { display: block; color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error { color: var(--flag); }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    main { padding-bottom: 50vh; }
    aside { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; max-height: 48vh;
            border-left: 0; border-top: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px 16px; gap: 12px; }
  }
</style>
</head>
<body>
<div class="layout">
  <main id="pages" aria-label="Draft pages"><p class="hint">Loading draft…</p></main>
  <aside>
    <div>
      <h1>Draft review</h1>
      <div class="sub" id="summary"></div>
      <div class="nav" id="nav" hidden>
        <button class="step" type="button" id="prev" aria-label="Previous chapter">‹</button>
        <select id="chapter" aria-label="Chapter"></select>
        <button class="step" type="button" id="next" aria-label="Next chapter">›</button>
      </div>
    </div>
    <section class="card" id="editor" aria-live="polite"></section>
    <section>
      <h2 id="flags-heading">Flagged panels</h2>
      <div id="flag-list"></div>
    </section>
  </aside>
</div>
<script>
const REASONS = ["Anachronism", "Character looks wrong", "Not in the verses", "Art error"];
let book = [], current = "", data = null, selected = null;
const drafts = {};   // unsaved notes, keyed by "chapter|panel"
let panels = {};

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of [].concat(children)) node.append(child);
  return node;
};
const label = id => "Panel " + Number(id.split("_").pop());
const chapterOf = id => book.find(c => c.id === id);
const flagsHere = () => chapterOf(current)?.flags ?? {};
const q = () => "?chapter=" + encodeURIComponent(current);

async function getJSON(url) {
  const response = await fetch(url);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error);
  return body;
}

async function load() {
  try {
    book = await getJSON("/chapters");
    const wanted = decodeURIComponent(location.hash.slice(1));
    const select = document.getElementById("chapter");
    select.replaceChildren(...book.map(c => el("option", {value: c.id, textContent: c.title})));
    document.getElementById("nav").hidden = book.length < 2;
    await openChapter(chapterOf(wanted) ? wanted : book[0].id);
  } catch (error) {
    document.getElementById("pages").replaceChildren(el("p", {className: "error", textContent: "Could not load the draft: " + error.message}));
  }
}

async function openChapter(id, panelId = null) {
  if (selected) stash();
  current = id;
  selected = null;
  if (book.length > 1) history.replaceState(null, "", "#" + encodeURIComponent(id));
  document.getElementById("chapter").value = id;
  const index = book.findIndex(c => c.id === id);
  document.getElementById("prev").disabled = index <= 0;
  document.getElementById("next").disabled = index >= book.length - 1;
  data = await getJSON("/data" + q());
  chapterOf(id).flags = data.flags;
  chapterOf(id).redrawn = data.redrawn;
  renderPages();
  if (panelId) select(panelId, true); else { renderSide(); window.scrollTo(0, 0); }
}

function step(delta) {
  const index = book.findIndex(c => c.id === current) + delta;
  if (index >= 0 && index < book.length) openChapter(book[index].id);
}

function renderPages() {
  const [W, H] = data.size;
  const pct = (v, total) => (v / total * 100) + "%";
  const root = document.getElementById("pages");
  root.replaceChildren();
  panels = {};
  for (const page of data.pages) {
    const figure = el("div", {className: "page"}, [
      el("span", {className: "page-label", textContent: page.label ?? "Page " + page.number}),
      el("img", {src: `/page/${page.number}${q()}`, alt: page.label ?? "Page " + page.number, width: W, height: H}),
    ]);
    for (const panel of page.panels) {
      const [x, y, w, h] = panel.frame;
      const button = el("button", {className: "panel", type: "button"});
      Object.assign(button.style, {left: pct(x, W), top: pct(y, H), width: pct(w, W), height: pct(h, H)});
      button.addEventListener("click", () => select(panel.id));
      panels[panel.id] = {...panel, page: page.number, button};
      figure.append(button);
    }
    root.append(figure);
  }
  if (book.length > 1) {
    // Reading straight on: the end of a chapter leads to the next one.
    const index = book.findIndex(c => c.id === current);
    const nextChapter = book[index + 1];
    if (nextChapter) {
      const go = el("button", {className: "step", type: "button", textContent: `Next: ${nextChapter.title} ›`});
      go.addEventListener("click", () => step(1));
      root.append(el("div", {className: "chapter-end"}, go));
    }
  }
  paintPanels();
}

function paintPanels() {
  const flags = flagsHere();
  const redrawn = chapterOf(current)?.redrawn ?? {};
  for (const [id, panel] of Object.entries(panels)) {
    const button = panel.button;
    // A redrawn panel stands out until it's looked at again: flag it again if it's still wrong.
    const fresh = !(id in flags) && id in redrawn;
    button.classList.toggle("flagged", id in flags);
    button.classList.toggle("redrawn", fresh);
    button.classList.toggle("selected", id === selected);
    button.setAttribute("aria-label", `${label(id)}, ${panel.refs}${id in flags ? ", flagged: " + flags[id].note
      : fresh ? ", redrawn after flag: " + redrawn[id] : ""}`);
    button.querySelector(".badge")?.remove();
    if (id in flags) button.append(el("span", {className: "badge", textContent: "Flagged"}));
    else if (fresh) button.append(el("span", {className: "badge redrawn", textContent: "Redrawn", title: "Flagged: " + redrawn[id]}));
  }
}

function stash() {
  const note = document.getElementById("note");
  if (note && selected) drafts[current + "|" + selected] = note.value;
}

function select(id, scroll = false) {
  stash();
  selected = id;
  paintPanels();
  renderSide();
  if (scroll && id) panels[id].button.scrollIntoView({behavior: "smooth", block: "center"});
  if (id) document.getElementById("note").focus({preventScroll: true});
}

function renderSide() {
  const flags = flagsHere();
  const total = book.reduce((sum, c) => sum + Object.keys(c.flags).length, 0);
  const chapter = chapterOf(current);
  document.getElementById("summary").textContent = book.length > 1
    ? `${book.length} chapters · ${total} flagged · ${chapter.title}: ${data.pages.length} pages, ${Object.keys(panels).length} panels`
    : `${chapter.title} · ${data.pages.length} pages · ${Object.keys(panels).length} panels · ${total} flagged`;

  const editor = document.getElementById("editor");
  if (!selected) {
    editor.replaceChildren(el("p", {className: "hint", textContent: "Click a panel with an error to flag it and note why it's wrong."}));
  } else {
    const panel = panels[selected], saved = flags[selected]?.note ?? "";
    const note = el("textarea", {id: "note", placeholder: "What's wrong with this panel?",
                                 value: drafts[current + "|" + selected] ?? saved});
    const status = el("span", {className: "status", id: "status"});
    const save = el("button", {className: "primary", type: "button", textContent: selected in flags ? "Update flag" : "Flag panel"});
    const clear = el("button", {className: "secondary", type: "button", textContent: "Remove flag", disabled: !(selected in flags)});
    const dirty = () => { status.textContent = note.value.trim() !== saved ? "Unsaved" : ""; };
    note.addEventListener("input", dirty);
    save.addEventListener("click", () => submit(note.value));
    clear.addEventListener("click", () => submit(""));
    const chips = REASONS.map(reason => {
      const chip = el("button", {className: "chip", type: "button", textContent: reason});
      chip.addEventListener("click", () => {
        note.value = note.value.trim() ? note.value.trimEnd() + "\n" + reason + ": " : reason + ": ";
        note.focus(); dirty();
      });
      return chip;
    });
    editor.replaceChildren(
      el("div", {className: "meta"}, [label(selected) + " ", el("span", {textContent: `· ${panel.refs} · page ${panel.page}`})]),
      el("div", {className: "chips"}, chips), note,
      el("div", {className: "actions"}, [save, clear, status]),
      el("div", {className: "keys", textContent: "Ctrl+Enter saves · Esc closes" + (book.length > 1 ? " · [ ] change chapter" : "")}));
    dirty();
  }

  // Every flag in the book, grouped by chapter; a flag elsewhere opens its chapter at that panel.
  document.getElementById("flags-heading").textContent = book.length > 1 ? "Flagged panels in the book" : "Flagged panels";
  const groups = book.filter(c => Object.keys(c.flags).length);
  const list = document.getElementById("flag-list");
  if (!groups.length) {
    list.replaceChildren(el("p", {className: "hint", textContent: "None yet."}));
    return;
  }
  list.replaceChildren(...groups.flatMap(c => {
    const items = Object.keys(c.flags).sort().map(id => {
      const button = el("button", {type: "button"}, [
        el("strong", {textContent: label(id)}), " ", el("span", {className: "status", textContent: c.panels[id] ?? ""}),
        el("span", {className: "note", textContent: c.flags[id].note})]);
      button.addEventListener("click", () => c.id === current ? select(id, true) : openChapter(c.id, id));
      return el("li", {}, button);
    });
    return [...(book.length > 1 ? [el("h3", {textContent: c.title})] : []), el("ul", {className: "flags"}, items)];
  }));
}

async function submit(note) {
  const status = document.getElementById("status");
  try {
    const response = await fetch("/flag", {method: "POST", headers: {"Content-Type": "application/json"},
                                           body: JSON.stringify({chapter: current, panel_id: selected, note})});
    const body = await response.json();
    if (!response.ok) throw new Error(body.error);
    chapterOf(current).flags = body.flags;
    delete drafts[current + "|" + selected];
    paintPanels();
    renderSide();
    document.getElementById("status").textContent = note.trim() ? "Saved" : "Flag removed";
  } catch (error) {
    status.textContent = "Not saved: " + error.message;
    status.classList.add("error");
  }
}

document.getElementById("chapter").addEventListener("change", event => openChapter(event.target.value));
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", event => {
  const typing = event.target.matches("textarea, select");
  if (event.key === "Escape" && selected) select(null);
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && selected) submit(document.getElementById("note").value);
  if (!typing && event.key === "[") step(-1);
  if (!typing && event.key === "]") step(1);
});
load();
</script>
</body>
</html>

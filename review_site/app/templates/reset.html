{% extends "base.html" %}
{% block title %}New password · {{ settings.site_name }}{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Choose a new password</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="password">New password <span class="hint">(at least 10 characters)</span></label>
    <input id="password" type="password" name="password" autocomplete="new-password" minlength="10" required autofocus>
    <p><button class="btn primary" type="submit">Save password</button></p>
  </form>
</div>
{% endblock %}
